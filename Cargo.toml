[workspace]
members = [
  "crates/localopenrouter-core",
  "crates/localopenrouter-daemon",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[profile.dev]
debug = 1

[workspace.dependencies]
anyhow = "1.0.102"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["clock", "serde"] }
dirs = "6.0.0"
futures = "0.3.31"
futures-util = "0.3.31"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.19", features = ["http1", "server", "tokio"] }
libc = "0.2.177"
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "stream"] }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = "2.10.3"
tauri-build = "2.5.6"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.22.0", features = ["serde", "v4"] }

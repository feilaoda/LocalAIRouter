[package]
name = "localairouter"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
libc.workspace = true
localairouter-core = { path = "../../../crates/localairouter-core" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
toml_edit = "0.22.27"
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", features = ["NSData"] }

[build-dependencies]
tauri-build.workspace = true
